<!doctype html><html><head><meta charset="utf-8"><title>Props sheet</title><style>
body{margin:0;background:#E2DACB;font-family:Helvetica,Arial,sans-serif}
.grid{display:grid;grid-template-columns:repeat(var(--cols,6),300px);gap:10px;padding:14px}
.cell{background:#F3F0EA;border-radius:6px;overflow:hidden}
.cell h4{margin:6px 8px 0;font-size:15px;color:#171717}.cell small{margin:0 8px;color:#525252;font-size:11px}
svg{display:block}
</style></head><body><div class="grid" id="g"></div>
<script type="module">
// Contact sheet of the prop library. ?only=a,b&states=1&focal=1&cols=6&dark=1
import { scope, defs } from '../../world-kit/draw.js';
import { PROPS, prop, propNames } from '../../world-kit/props.js';
const q = new URLSearchParams(location.search);
const only = q.get('only') ? q.get('only').split(',') : null;
const dark = q.get('dark') === '1';
document.querySelector('.grid').style.setProperty('--cols', q.get('cols') || '6');
const out = [];
let n = 0;
for (const name of propNames()) {
  if (only && !only.includes(name)) continue;
  const p = PROPS[name];
  const states = q.get('states') === '0' ? [p.states[0]] : p.states;
  for (const state of states) for (const focal of q.get('focal') === '1' ? [false, true] : [false]) {
    scope(`c${++n}-`, dark ? 'night' : 'paper');
    const [w, h] = p.size;
    const s = Math.min(1, 250 / w, 250 / h);
    let svg;
    try { svg = prop(name, 150, 286, { s, state, focal }); }
    catch (e) { svg = `<text x="10" y="150" font-size="12" fill="red">${String(e.message).replace(/</g, '&lt;')}</text>`; }
    out.push(`<div class="cell"><h4>${name}</h4><small>${state}${focal ? ' · focal' : ''}</small><svg width="300" height="330" viewBox="0 0 300 330" overflow="hidden" style="background:${dark ? '#171717' : '#F3F0EA'}">${defs()}${svg}</svg></div>`);
  }
}
document.getElementById('g').innerHTML = out.join('');
document.body.dataset.done = '1';
</script></body></html>
